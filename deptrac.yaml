# Le découpage par domaine n'est une architecture que s'il est vérifié.
# Un domaine qui en appelle un autre fait échouer la CI.
#
# `--fail-on-uncovered` est volontairement actif : toute classe App\ qui n'est
# rattachée à aucune couche fait échouer l'analyse. On ne peut donc pas créer un
# src/Autre/ sans le déclarer ici — c'est tout l'intérêt.
deptrac:
  paths:
    - ./src
  layers:
    - name: Devis
      collectors:
        - type: directory
          value: src/Devis/.*
    # Le domaine Extraction est coupé en deux, et c'est le cœur de l'affaire :
    # l'interface `Extracteur` et le suivi des coûts d'un côté, l'adaptateur
    # Anthropic de l'autre. La règle ci-dessous interdit au premier de connaître
    # le second — l'inversion de dépendance cesse d'être une intention.
    - name: Extraction
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Extraction/.*
          must_not:
            - type: directory
              value: src/Extraction/Infrastructure/.*
    - name: ExtractionInfrastructure
      collectors:
        - type: directory
          value: src/Extraction/Infrastructure/.*
    - name: Shared
      collectors:
        - type: directory
          value: src/Shared/.*
    # La seule couche autorisée à connaître plusieurs domaines à la fois.
    # L'orchestration est un rôle explicite, pas une entorse tolérée.
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: Kernel
      collectors:
        - type: classNameRegex
          value: '/^App\\Kernel$/'
    # Tout ce qui n'est pas App\ : framework et bibliothèques.
    - name: Vendor
      collectors:
        - type: classNameRegex
          value: '/^(?!App\\)/'

  ruleset:
    # Chaque domaine ne connaît que Shared. Les échanges entre domaines passeront
    # par des événements ou des ports explicites, ajoutés ici au cas par cas.
    Devis:
      - Shared
      - Vendor
    Extraction:
      - Shared
      - Vendor
    # L'adaptateur connaît le port, jamais l'inverse. C'est la seule couche
    # autorisée à nommer le SDK Anthropic ou Doctrine pour ce domaine.
    ExtractionInfrastructure:
      - Extraction
      - Shared
      - Vendor
    Shared:
      - Vendor
    Application:
      - Devis
      - Extraction
      - Shared
      - Vendor
    Kernel:
      - Application
      - Devis
      - Extraction
      - Shared
      - Vendor
    Vendor: ~
